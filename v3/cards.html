<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なまえカード｜ピッとナマピ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#243746; --mute:#6C7882; --line:#DEDFDC; --bg:#F7F5F0;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Noto Sans JP',sans-serif; color:var(--ink); background:var(--bg); padding:28px;}
  .head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
  h1{font-size:22px; margin:0;}
  p{color:var(--mute); font-size:14px; margin:4px 0 0;}
  button{font:inherit; font-weight:700; border:none; border-radius:12px; padding:10px 22px; background:#368C85; color:#fff; cursor:pointer;}
  h2{font-size:15px; color:var(--mute); margin:22px 0 10px;}
  .cards{display:flex; flex-wrap:wrap; gap:6mm;}
  /* 名刺サイズ（91×55mm） */
  .card{width:91mm; height:55mm; background:#fff; border:1px dashed var(--line); border-radius:4mm; border-top:5mm solid var(--c);
        display:flex; align-items:center; gap:5mm; padding:4mm 6mm; break-inside:avoid;}
  .card .qr{width:36mm; height:36mm; flex-shrink:0;}
  .card .qr svg{width:100%; height:100%; display:block;}
  .card small{font-size:9pt; color:var(--mute);}
  .card b{display:block; font-size:22pt; font-weight:900; line-height:1.2; word-break:break-all;}
  /* 画面のふちに貼る小さいシール（30×38mm） */
  .mini{width:30mm; height:38mm; background:#fff; border:1px dashed var(--line); border-radius:3mm; border-top:3mm solid var(--c);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1mm; padding:2mm; break-inside:avoid;}
  .mini .qr{width:24mm; height:24mm;}
  .mini .qr svg{width:100%; height:100%; display:block;}
  .mini b{font-size:9pt; font-weight:900; text-align:center; line-height:1.2; overflow:hidden; max-height:2.4em;}
  @media print{
    body{background:#fff; padding:0;}
    .head{display:none;}
    .card,.mini{border-style:solid;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>
  <div class="head">
    <div>
      <h1>なまえカード</h1>
      <p>名前は おやモードの「読書通帳」で変えられます。印刷して切り取り、ラミネートすると長持ちします。</p>
    </div>
    <button onclick="print()">印刷する</button>
  </div>

  <h2>カード（名刺サイズ）</h2>
  <div class="cards" id="cards"></div>

  <h2>画面のふちに貼る小さいシール</h2>
  <div class="cards" id="minis"></div>

<script type="module">
  import qrcode from './vendor/qrcode.mjs';
  import { kids } from './js/kids.js?v=4.3';

  // 名前やカードの文字は英数字だけ（スキャナーの配列ずれの影響を受けない）
  const svg = text => {
    const q = qrcode(0, 'M');
    q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const list = kids.list();
  document.getElementById('cards').innerHTML = list.map(k => `
    <div class="card" style="--c:${k.color}">
      <div class="qr">${svg('SD-USER-' + k.id)}</div>
      <div><small>なまえカード</small><b>${esc(k.name)}</b><small>ピッとナマピ</small></div>
    </div>`).join('');
  document.getElementById('minis').innerHTML = list.flatMap(k => [1, 2].map(() => `
    <div class="mini" style="--c:${k.color}">
      <div class="qr">${svg('SD-USER-' + k.id)}</div><b>${esc(k.name)}</b>
    </div>`)).join('');
</script>
</body>
</html>
